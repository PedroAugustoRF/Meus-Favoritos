/* ---- tema: claro/escuro + cor principal ---- */
function ThemeControls() {
  const [theme, setTheme] = useState(() => document.documentElement.dataset.theme);
  const [accent, setAccent] = useState(() => document.documentElement.dataset.accent);
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const dark = theme === "dark";

  useEffect(() => {
    if (!open) return;
    const off = (e) => {
      if (e.type === "keydown" ? e.key === "Escape" : !ref.current?.contains(e.target)) setOpen(false);
    };
    document.addEventListener("mousedown", off);
    document.addEventListener("keydown", off);
    return () => { document.removeEventListener("mousedown", off); document.removeEventListener("keydown", off); };
  }, [open]);

  const pickTheme = () => { const t = dark ? "light" : "dark"; setTheme(t); window.applyTheme(t, accent); };
  const pickAccent = (k) => { setAccent(k); window.applyTheme(theme, k); };

  return (
    <div ref={ref} className="relative flex items-center gap-1">
      <Button variant="ghost" size="icon" onClick={pickTheme} title={dark ? "Tema claro" : "Tema escuro"} aria-label={dark ? "Usar tema claro" : "Usar tema escuro"}>
        {dark ? <Sun className="h-5 w-5" /> : <Moon className="h-5 w-5" />}
      </Button>
      <Button variant="ghost" size="icon" onClick={() => setOpen(!open)} title="Cor principal" aria-label="Escolher cor principal" aria-expanded={open}>
        <Palette className="h-5 w-5" />
      </Button>
      {open && (
        <div className="absolute right-0 top-12 z-50 w-80 max-w-[calc(100vw-2rem)] rounded-2xl border border-line bg-surface p-4 shadow-lg">
          <p className="mb-3 text-sm font-bold">Cor principal</p>
